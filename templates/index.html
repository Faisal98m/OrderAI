<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OrderAI</title>
</head>


<body>

    <h1>OrderAI</h1>

    <div id="messages"></div>

    <input
        id="message-input"
        type="text"
        placeholder="Type your order..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <button
        id="record-button"
        onclick="toggleConversation()"
    >
        🎤 Start conversation
    </button>

    <p id="voice-status"></p>


<script>

const input =
    document.getElementById("message-input");

const messages =
    document.getElementById("messages");

const voiceStatus =
    document.getElementById("voice-status");

const recordButton =
    document.getElementById("record-button");


let mediaRecorder = null;
let audioChunks = [];

let recording = false;
let conversationMode = false;

let activeStream = null;

let audioContext = null;
let analyser = null;
let monitoringFrame = null;

let speechDetected = false;
let lastSoundTime = null;


// How quiet audio must be to count as silence
const SILENCE_THRESHOLD = 0.02;

// How long silence must last before we send the turn
const SILENCE_DURATION = 1500;



async function sendMessage(messageOverride = null) {

    const message = (
        messageOverride !== null
            ? messageOverride
            : input.value
    ).trim();


    if (!message) {
        return;
    }


    messages.innerHTML += `
        <p>
            <strong>You:</strong>
            ${message}
        </p>
    `;


    input.value = "";

    voiceStatus.textContent =
        "OrderAI is thinking...";


    const response = await fetch("/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })

    });


    const data = await response.json();


    messages.innerHTML += `
        <p>
            <strong>OrderAI:</strong>
            ${data.message}
        </p>
    `;


    await speakResponse(data.message);


    // OrderAI finished speaking.
    // Start listening for the customer again.
    if (conversationMode) {

        setTimeout(
            startRecording,
            300
        );

    }
}



function speakResponse(text) {

    return new Promise((resolve) => {

        if (!("speechSynthesis" in window)) {
            resolve();
            return;
        }


        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(text);


        speech.lang = "en-GB";


        speech.onstart = function() {

            voiceStatus.textContent =
                "OrderAI is speaking...";

        };


        speech.onend = function() {

            resolve();

        };


        speech.onerror = function() {

            resolve();

        };


        window.speechSynthesis.speak(speech);

    });
}



async function toggleConversation() {

    if (!conversationMode) {

        conversationMode = true;

        recordButton.textContent =
            "⏹ End conversation";

        await startRecording();

    } else {

        conversationMode = false;

        recordButton.textContent =
            "🎤 Start conversation";

        voiceStatus.textContent =
            "Conversation ended.";

        window.speechSynthesis.cancel();

        stopRecording();

    }
}



async function startRecording() {

    if (!conversationMode || recording) {
        return;
    }


    try {

        activeStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioChunks = [];

        speechDetected = false;

        lastSoundTime = null;


        mediaRecorder =
            new MediaRecorder(activeStream);


        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };


        mediaRecorder.onstop =
            async function() {

                stopSilenceMonitoring();


                const mimeType =
                    mediaRecorder.mimeType;


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type: mimeType
                        }
                    );


                if (activeStream) {

                    activeStream
                        .getTracks()
                        .forEach(
                            track => track.stop()
                        );

                }


                activeStream = null;


                if (!conversationMode) {
                    return;
                }


                if (!speechDetected) {

                    voiceStatus.textContent =
                        "Listening...";

                    setTimeout(
                        startRecording,
                        300
                    );

                    return;
                }


                voiceStatus.textContent =
                    "Transcribing...";


                await transcribeAudio(
                    audioBlob,
                    mimeType
                );

            };


        mediaRecorder.start();

        recording = true;


        voiceStatus.textContent =
            "Listening...";


        startSilenceMonitoring(
            activeStream
        );


    } catch (error) {

        console.error(error);


        conversationMode = false;

        recording = false;


        recordButton.textContent =
            "🎤 Start conversation";


        voiceStatus.textContent =
            "Could not access microphone: "
            + error.message;

    }
}



function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }


    recording = false;

}



function startSilenceMonitoring(stream) {

    audioContext =
        new AudioContext();


    analyser =
        audioContext.createAnalyser();


    analyser.fftSize = 2048;


    const source =
        audioContext
            .createMediaStreamSource(stream);


    source.connect(analyser);


    const samples =
        new Uint8Array(
            analyser.fftSize
        );


    function monitor() {

        if (
            !recording ||
            !analyser
        ) {
            return;
        }


        analyser.getByteTimeDomainData(
            samples
        );


        let sumSquares = 0;


        for (
            let i = 0;
            i < samples.length;
            i++
        ) {

            const normalized =
                (samples[i] - 128) / 128;


            sumSquares +=
                normalized * normalized;

        }


        const rms =
            Math.sqrt(
                sumSquares /
                samples.length
            );


        const now =
            Date.now();


        // Voice / sound detected
        if (
            rms >
            SILENCE_THRESHOLD
        ) {

            speechDetected = true;

            lastSoundTime = now;

        }


        // Speech happened,
        // then silence lasted long enough.
        if (
            speechDetected &&
            lastSoundTime &&
            now - lastSoundTime
                >= SILENCE_DURATION
        ) {

            voiceStatus.textContent =
                "Got it...";


            stopRecording();

            return;

        }


        monitoringFrame =
            requestAnimationFrame(
                monitor
            );

    }


    monitor();
}



function stopSilenceMonitoring() {

    if (monitoringFrame) {

        cancelAnimationFrame(
            monitoringFrame
        );

        monitoringFrame = null;

    }


    analyser = null;


    if (audioContext) {

        audioContext.close();

        audioContext = null;

    }

}



async function transcribeAudio(
    audioBlob,
    mimeType
) {

    const formData =
        new FormData();


    let extension = "webm";


    if (mimeType.includes("mp4")) {

        extension = "mp4";

    } else if (
        mimeType.includes("ogg")
    ) {

        extension = "ogg";

    } else if (
        mimeType.includes("wav")
    ) {

        extension = "wav";

    }


    formData.append(
        "audio",
        audioBlob,
        `recording.${extension}`
    );


    try {

        const response =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            voiceStatus.textContent =
                data.error ||
                "Transcription failed.";


            if (conversationMode) {

                setTimeout(
                    startRecording,
                    300
                );

            }


            return;
        }


        const transcript =
            data.text.trim();


        if (!transcript) {

            if (conversationMode) {

                setTimeout(
                    startRecording,
                    300
                );

            }


            return;
        }


        voiceStatus.textContent =
            `Heard: ${transcript}`;


        input.value =
            transcript;


        await sendMessage(
            transcript
        );


    } catch (error) {

        console.error(error);


        voiceStatus.textContent =
            "Audio upload failed.";


        if (conversationMode) {

            setTimeout(
                startRecording,
                300
            );

        }

    }
}



input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);

</script>

</body>

</html>
