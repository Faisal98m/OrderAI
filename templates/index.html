<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OrderAI</title>
</head>


<body>

    <h1>OrderAI</h1>

    <div id="messages"></div>

    <input
        id="message-input"
        type="text"
        placeholder="Type your order..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <button
        id="realtime-button"
        onclick="startRealtime()"
    >
        Start Realtime Test
    </button>

    <audio
        id="realtime-audio"
        autoplay
    ></audio>

    <button
        id="record-button"
        onclick="toggleConversation()"
    >
        🎤 Start conversation
    </button>

    <p id="voice-status"></p>


<script>

const input =
    document.getElementById("message-input");

const messages =
    document.getElementById("messages");

const voiceStatus =
    document.getElementById("voice-status");

const recordButton =
    document.getElementById("record-button");


let mediaRecorder = null;
let audioChunks = [];

let recording = false;
let conversationMode = false;

let activeStream = null;

let audioContext = null;
let analyser = null;
let monitoringFrame = null;

let speechDetected = false;
let lastSoundTime = null;

let realtimePeer = null;
let realtimeChannel = null;
let realtimeStream = null;


// How quiet audio must be to count as silence
const SILENCE_THRESHOLD = 0.02;

// How long silence must last before we send the turn
const SILENCE_DURATION = 1500;



async function sendMessage(messageOverride = null) {

    const message = (
        messageOverride !== null
            ? messageOverride
            : input.value
    ).trim();


    if (!message) {
        return;
    }


    messages.innerHTML += `
        <p>
            <strong>You:</strong>
            ${message}
        </p>
    `;


    input.value = "";

    voiceStatus.textContent =
        "OrderAI is thinking...";


    const response = await fetch("/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })

    });


    const data = await response.json();


    messages.innerHTML += `
        <p>
            <strong>OrderAI:</strong>
            ${data.message}
        </p>
    `;


    await speakResponse(data.message);


    if (conversationMode) {

        setTimeout(
            startRecording,
            300
        );

    }
}



function speakResponse(text) {

    return new Promise((resolve) => {

        if (!("speechSynthesis" in window)) {
            resolve();
            return;
        }


        window.speechSynthesis.cancel();


        const speech =
            new SpeechSynthesisUtterance(text);


        speech.lang = "en-GB";


        speech.onstart = function() {

            voiceStatus.textContent =
                "OrderAI is speaking...";

        };


        speech.onend = function() {

            resolve();

        };


        speech.onerror = function() {

            resolve();

        };


        window.speechSynthesis.speak(speech);

    });
}



async function toggleConversation() {

    if (!conversationMode) {

        conversationMode = true;

        recordButton.textContent =
            "⏹ End conversation";

        await startRecording();

    } else {

        conversationMode = false;

        recordButton.textContent =
            "🎤 Start conversation";

        voiceStatus.textContent =
            "Conversation ended.";

        window.speechSynthesis.cancel();

        stopRecording();

    }
}



async function startRecording() {

    if (!conversationMode || recording) {
        return;
    }


    try {

        activeStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        audioChunks = [];

        speechDetected = false;

        lastSoundTime = null;


        mediaRecorder =
            new MediaRecorder(activeStream);


        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };


        mediaRecorder.onstop =
            async function() {

                stopSilenceMonitoring();


                const mimeType =
                    mediaRecorder.mimeType;


                const audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type: mimeType
                        }
                    );


                if (activeStream) {

                    activeStream
                        .getTracks()
                        .forEach(
                            track => track.stop()
                        );

                }


                activeStream = null;


                if (!conversationMode) {
                    return;
                }


                if (!speechDetected) {

                    voiceStatus.textContent =
                        "Listening...";

                    setTimeout(
                        startRecording,
                        300
                    );

                    return;
                }


                voiceStatus.textContent =
                    "Transcribing...";


                await transcribeAudio(
                    audioBlob,
                    mimeType
                );

            };


        mediaRecorder.start();

        recording = true;


        voiceStatus.textContent =
            "Listening...";


        startSilenceMonitoring(
            activeStream
        );


    } catch (error) {

        console.error(error);


        conversationMode = false;

        recording = false;


        recordButton.textContent =
            "🎤 Start conversation";


        voiceStatus.textContent =
            "Could not access microphone: "
            + error.message;

    }
}



function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }


    recording = false;

}



function startSilenceMonitoring(stream) {

    audioContext =
        new AudioContext();


    analyser =
        audioContext.createAnalyser();


    analyser.fftSize = 2048;


    const source =
        audioContext
            .createMediaStreamSource(stream);


    source.connect(analyser);


    const samples =
        new Uint8Array(
            analyser.fftSize
        );


    function monitor() {

        if (
            !recording ||
            !analyser
        ) {
            return;
        }


        analyser.getByteTimeDomainData(
            samples
        );


        let sumSquares = 0;


        for (
            let i = 0;
            i < samples.length;
            i++
        ) {

            const normalized =
                (samples[i] - 128) / 128;


            sumSquares +=
                normalized * normalized;

        }


        const rms =
            Math.sqrt(
                sumSquares /
                samples.length
            );


        const now =
            Date.now();


        if (
            rms >
            SILENCE_THRESHOLD
        ) {

            speechDetected = true;

            lastSoundTime = now;

        }


        if (
            speechDetected &&
            lastSoundTime &&
            now - lastSoundTime
                >= SILENCE_DURATION
        ) {

            voiceStatus.textContent =
                "Got it...";


            stopRecording();

            return;

        }


        monitoringFrame =
            requestAnimationFrame(
                monitor
            );

    }


    monitor();
}



function stopSilenceMonitoring() {

    if (monitoringFrame) {

        cancelAnimationFrame(
            monitoringFrame
        );

        monitoringFrame = null;

    }


    analyser = null;


    if (audioContext) {

        audioContext.close();

        audioContext = null;

    }

}



async function transcribeAudio(
    audioBlob,
    mimeType
) {

    const formData =
        new FormData();


    let extension = "webm";


    if (mimeType.includes("mp4")) {

        extension = "mp4";

    } else if (
        mimeType.includes("ogg")
    ) {

        extension = "ogg";

    } else if (
        mimeType.includes("wav")
    ) {

        extension = "wav";

    }


    formData.append(
        "audio",
        audioBlob,
        `recording.${extension}`
    );


    try {

        const response =
            await fetch(
                "/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            voiceStatus.textContent =
                data.error ||
                "Transcription failed.";


            if (conversationMode) {

                setTimeout(
                    startRecording,
                    300
                );

            }


            return;
        }


        const transcript =
            data.text.trim();


        if (!transcript) {

            if (conversationMode) {

                setTimeout(
                    startRecording,
                    300
                );

            }


            return;
        }


        voiceStatus.textContent =
            `Heard: ${transcript}`;


        input.value =
            transcript;


        await sendMessage(
            transcript
        );


    } catch (error) {

        console.error(error);


        voiceStatus.textContent =
            "Audio upload failed.";


        if (conversationMode) {

            setTimeout(
                startRecording,
                300
            );

        }

    }
}



async function startRealtime() {

    const button =
        document.getElementById(
            "realtime-button"
        );

    const audioElement =
        document.getElementById(
            "realtime-audio"
        );


    button.disabled = true;
    button.textContent =
        "Connecting...";


    try {

        // 1. Get temporary credential from Flask
        const tokenResponse =
            await fetch(
                "/realtime-session"
            );


        const tokenData =
            await tokenResponse.json();


        const ephemeralKey =
            tokenData.value;


        // 2. Create WebRTC connection
        realtimePeer =
            new RTCPeerConnection();


        // 3. Play model audio
        realtimePeer.ontrack =
            function(event) {

                audioElement.srcObject =
                    event.streams[0];

            };


        // 4. Get microphone
        realtimeStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        realtimeStream
            .getTracks()
            .forEach(track => {

                realtimePeer.addTrack(
                    track,
                    realtimeStream
                );

            });


        // 5. Create Realtime data channel
        realtimeChannel =
            realtimePeer.createDataChannel(
                "oai-events"
            );


        // 6. Configure Realtime session
        realtimeChannel.onopen =
            function() {

                console.log(
                    "Realtime data channel open"
                );


                button.textContent =
                    "Realtime connected";


realtimeChannel.send(
    JSON.stringify({
        type: "session.update",

        session: {
            type: "realtime",
            model: "gpt-realtime-2.1-mini",

            instructions: `
                You are the AI receptionist for OrderAI Burger House.

                Your job is to help customers explore the menu
                and build an accurate food order.

                TOOL RULES

                Use search_menu when:
                - The customer asks what food or drinks are available.
                - The customer asks about a price.
                - You need to identify a menu item before answering.

                Use add_item_to_order when:
                - The customer clearly asks to add a specific item.
                - The quantity is known.
                - The requested item is sufficiently specific.

                Use get_order when:
                - The customer asks what is currently in their order.
                - The customer asks for their total.
                - The customer indicates they have finished ordering.

                 When the customer wants to remove an item:
                    - Use get_order first to inspect the current order.
                    - Identify the exact item_id for the requested item.
                    - If multiple items could match, ask the customer which one they mean.
                    - Then call remove_from_order using the exact item_id.
                    - Never guess an item_id.
                
                When the customer says they are finished ordering:
                    1. Call get_order.
                    2. Read back the complete order and total.
                    3. Ask the customer to confirm the order.
                    4. Do not submit the order until the customer explicitly confirms.

                    When the customer confirms:
                    - Call validate_order.
                    - If validation succeeds, call confirm_order.
                    - Then call submit_order.
                    - Tell the customer the order has been submitted only if submit_order succeeds.

                When an order has already been submitted and the customer starts ordering again:
                    - Call start_new_order before adding any new items.

                    Also call start_new_order if the customer explicitly asks to start a new order.

                    Never add new items to an order whose status is submitted.

                IMPORTANT RULES

                Never invent menu items or prices.

                Never say an item was added unless
                add_item_to_order succeeds.

                If the customer's request is ambiguous,
                ask a clarification question instead of guessing.

                Example:
                Customer: "Add two burgers."
                Assistant: Ask which burgers they want.

                When the customer says they are finished ordering,
                call get_order and read back their complete order
                and total.

                Keep spoken responses short and natural.


            `,

tools: [
    {
        type: "function",
        name: "add_item_to_order",
        description:
            "Add a menu item to the customer's current order.",
        parameters: {
            type: "object",
            properties: {
                search_term: {
                    type: "string"
                },
                quantity: {
                    type: "integer"
                }
            },
            required: [
                "search_term",
                "quantity"
            ],
            additionalProperties: false
        }
    },

    {
        type: "function",
        name: "get_order",
        description:
            "Get the customer's current order and total.",
        parameters: {
            type: "object",
            properties: {},
            additionalProperties: false
        }
    },
    {
    type: "function",
    name: "search_menu",
    description:
        "Search the restaurant menu for food, drinks, menu items or prices.",
    parameters: {
        type: "object",
        properties: {
            search_term: {
                type: "string",
                description:
                    "The food or drink the customer is asking about."
            }
        },
        required: [
            "search_term"
        ],
        additionalProperties: false
    }
},
{
    type: "function",
    name: "remove_from_order",
    description:
        "Remove a menu item from the customer's current order. If the customer's request is ambiguous, do not guess which item they mean; ask a clarification question first.",
    parameters: {
        type: "object",
        properties: {
            search_term: {
                type: "string",
                description:
                    "The menu item the customer wants removed."
            },
            quantity: {
                type: "integer",
                description:
                    "The quantity to remove from the order."
            }
        },
        required: [
            "item_id",
            "quantity"
        ],
        additionalProperties: false
    }
},
{
    type: "function",
    name: "validate_order",
    description:
        "Validate the customer's current order before confirmation. Use this after the customer has reviewed the order and explicitly confirms they want to proceed.",
    parameters: {
        type: "object",
        properties: {},
        additionalProperties: false
    }
},
{
    type: "function",
    name: "confirm_order",
    description:
        "Confirm the customer's current validated order. Only use this after validate_order succeeds.",
    parameters: {
        type: "object",
        properties: {},
        additionalProperties: false
    }
},
{
    type: "function",
    name: "submit_order",
    description:
        "Submit the customer's confirmed order for preparation. Only use this after the order has been validated and confirmed.",
    parameters: {
        type: "object",
        properties: {},
        additionalProperties: false
    }
},
{
    type: "function",
    name: "start_new_order",
    description:
        "Start a fresh customer order after the previous order has been submitted or when the customer explicitly asks to begin a new order.",
    parameters: {
        type: "object",
        properties: {},
        additionalProperties: false
    }
}
],

            tool_choice: "auto"
        }
    })
);

            };


        // 7. Listen for Realtime events
realtimeChannel.onmessage =
    async function(event) {

        const message =
            JSON.parse(event.data);


        console.log(
            "Realtime event:",
            message
        );


        // Confirm the session update worked
        if (
            message.type ===
            "session.updated"
        ) {

            console.log(
                "UPDATED SESSION TOOLS:",
                message.session.tools
            );

        }


        // Show Realtime API errors
        if (
            message.type ===
            "error"
        ) {

            console.error(
                "REALTIME API ERROR:",
                message
            );

        }


        // Handle completed function calls
        if (
            message.type ===
            "response.output_item.done" &&
            message.item &&
            message.item.type ===
            "function_call"
        ) {

            const toolCall =
                message.item;


            console.log(
                "FUNCTION CALL:",
                toolCall
            );


            const argumentsObject =
                JSON.parse(
                    toolCall.arguments
                );


            // Execute the Python tool through Flask
            const toolResponse =
                await fetch(
                    "/realtime-tool",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name:
                                    toolCall.name,

                                arguments:
                                    argumentsObject
                            })
                    }
                );


            const toolData =
                await toolResponse.json();


            console.log(
                "Tool result:",
                toolData
            );


            if (!toolResponse.ok) {

                console.error(
                    "Tool execution failed:",
                    toolData
                );

                return;

            }


            // Send the tool result back to Realtime
            realtimeChannel.send(
                JSON.stringify({

                    type:
                        "conversation.item.create",

                    item: {

                        type:
                            "function_call_output",

                        call_id:
                            toolCall.call_id,

                        output:
                            JSON.stringify(
                                toolData.result
                            )

                    }

                })
            );


            // Ask the model to continue
            // after receiving the tool result
            realtimeChannel.send(
                JSON.stringify({

                    type:
                        "response.create"

                })
            );

        

    };
            };


        // 8. Create browser SDP offer
        const offer =
            await realtimePeer
                .createOffer();


        await realtimePeer
            .setLocalDescription(
                offer
            );


        // 9. Send SDP to OpenAI
        const sdpResponse =
            await fetch(

                "https://api.openai.com/v1/realtime/calls",

                {
                    method:
                        "POST",

                    body:
                        offer.sdp,

                    headers: {

                        "Authorization":
                            `Bearer ${ephemeralKey}`,

                        "Content-Type":
                            "application/sdp"

                    }

                }
            );


        if (!sdpResponse.ok) {

            const errorText =
                await sdpResponse.text();


            throw new Error(
                errorText
            );

        }


        // 10. Receive SDP answer
        const answer = {

            type:
                "answer",

            sdp:
                await sdpResponse.text()

        };


        await realtimePeer
            .setRemoteDescription(
                answer
            );


        button.textContent =
            "Realtime connected";


    } catch (error) {

        console.error(
            "Realtime error:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            "Start Realtime Test";

    }

}



input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);

</script>

</body>

</html>
